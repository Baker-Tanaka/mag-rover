services:
  mag-rover:
    build:
      context: .
      dockerfile: Dockerfile
    image: "ghcr.io/baker-link-lab/bakerlink-env:latest"
    user: vscode
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - "../:/mag-rover"
    working_dir: /mag-rover
    command: sleep infinity
